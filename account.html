<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Account — Kavox</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700;800&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }
  a, button, input { -webkit-tap-highlight-color:transparent; }
  a:focus, button:focus { outline:none; }
  html,body { background:#0a0a0c; color:#f5f2ea; font-family:'Inter',-apple-system,sans-serif; overflow-x:hidden; min-height:100vh; }
  h1,h2,h3 { font-family:'Playfair Display',serif; }
  body { opacity:0; transition:opacity .32s ease; }
  body.kv-page-ready { opacity:1; }

  nav { position:fixed; top:0; left:0; right:0; z-index:50; display:flex; align-items:center; justify-content:space-between; padding:22px 48px; background:#0a0a0c; border-bottom:1px solid rgba(255,255,255,.08); }
  .logo { display:flex; align-items:center; text-decoration:none; }
  .logo img { display:block; height:26px; width:auto; }
  .exit-link { font-size:13px; color:rgba(255,255,255,.6); text-decoration:none; cursor:pointer; background:none; border:none; font-family:'Inter',sans-serif; }
  .exit-link:hover { color:#fff; }
  @media (max-width:768px){ nav{ padding:22px 24px; } }

  .wrap { min-height:100vh; padding:120px 24px 80px; max-width:760px; margin:0 auto; }

  /* Loading */
  #acct-loading { display:flex; align-items:center; justify-content:center; min-height:50vh; color:rgba(255,255,255,.5); font-size:14px; }

  /* Onboarding overlay */
  #onboarding-overlay { position:fixed; inset:0; z-index:100; background:rgba(10,10,12,.92); backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; padding:24px; }
  .onboard-card { width:100%; max-width:420px; text-align:center; }
  .onboard-eyebrow { font-size:12px; letter-spacing:.35em; text-transform:uppercase; color:#8a8375; margin-bottom:14px; }
  .onboard-title { font-size:clamp(24px,4vw,30px); font-weight:700; letter-spacing:-.02em; margin-bottom:10px; }
  .onboard-sub { font-size:14px; color:rgba(255,255,255,.55); margin-bottom:32px; }

  .avatar-picker { position:relative; width:104px; height:104px; margin:0 auto 28px; cursor:pointer; }
  .avatar-picker .avatar-img { width:104px; height:104px; border-radius:50%; object-fit:cover; border:1px solid rgba(255,255,255,.15); background:#151517; display:flex; align-items:center; justify-content:center; font-family:'Playfair Display',serif; font-size:38px; color:#d8d0b8; }
  .avatar-picker .avatar-edit { position:absolute; bottom:0; right:0; width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,#ece6d6,#d8d0b8); display:flex; align-items:center; justify-content:center; border:2px solid #0a0a0c; }
  .avatar-picker .avatar-edit svg { width:14px; height:14px; }
  .avatar-picker input[type=file] { display:none; }

  .field { display:flex; flex-direction:column; gap:8px; text-align:left; margin-bottom:22px; }
  .field label { font-size:11.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:rgba(255,255,255,.5); }
  .field input {
    width:100%; padding:14px 16px; border:1px solid rgba(255,255,255,.15); border-radius:10px;
    font-family:'Inter',sans-serif; font-size:14.5px; color:#f5f2ea; background:#151517; outline:none;
  }
  .field input:focus { border-color:#d8d0b8; background:#1a1a1d; }

  .btn-primary { width:100%; padding:14px 20px; border:none; border-radius:10px; background:linear-gradient(135deg,#ece6d6,#d8d0b8); color:#0a0a0c; font-family:'Inter',sans-serif; font-size:14px; font-weight:700; cursor:pointer; transition:opacity .2s; }
  .btn-primary:hover { opacity:.92; }
  .btn-primary:disabled { opacity:.5; cursor:default; }
  .btn-skip { margin-top:14px; background:none; border:none; color:rgba(255,255,255,.4); font-size:13px; cursor:pointer; font-family:'Inter',sans-serif; text-decoration:underline; }
  .onboard-err { display:none; font-size:13px; color:#e57373; margin-bottom:16px; text-align:center; }

  /* Account header */
  .acct-header { display:flex; align-items:center; gap:20px; margin-bottom:44px; }
  .acct-avatar-wrap { position:relative; width:76px; height:76px; flex-shrink:0; cursor:pointer; }
  .acct-avatar-wrap .avatar-img { width:76px; height:76px; border-radius:50%; object-fit:cover; border:1px solid rgba(255,255,255,.15); background:#151517; display:flex; align-items:center; justify-content:center; font-family:'Playfair Display',serif; font-size:28px; color:#d8d0b8; }
  .acct-avatar-wrap .avatar-edit { position:absolute; bottom:-2px; right:-2px; width:26px; height:26px; border-radius:50%; background:linear-gradient(135deg,#ece6d6,#d8d0b8); display:flex; align-items:center; justify-content:center; border:2px solid #0a0a0c; }
  .acct-avatar-wrap .avatar-edit svg { width:11px; height:11px; }
  .acct-avatar-wrap input[type=file] { display:none; }

  .acct-name-row { display:flex; align-items:center; gap:10px; }
  .acct-name { font-family:'Playfair Display',serif; font-size:24px; font-weight:700; letter-spacing:-.01em; }
  .acct-name-edit-btn { background:none; border:none; cursor:pointer; opacity:.5; padding:4px; }
  .acct-name-edit-btn:hover { opacity:1; }
  .acct-name-edit-btn svg { width:14px; height:14px; }
  .acct-name-input { font-family:'Playfair Display',serif; font-size:22px; font-weight:700; background:#151517; border:1px solid rgba(255,255,255,.15); border-radius:8px; padding:6px 10px; color:#f5f2ea; outline:none; display:none; }
  .acct-name-input:focus { border-color:#d8d0b8; }
  .acct-email { font-size:13.5px; color:rgba(255,255,255,.45); margin-top:3px; }

  .acct-actions-row { display:flex; gap:12px; margin-bottom:40px; }
  .btn-outline { padding:11px 20px; border-radius:9px; border:1px solid rgba(255,255,255,.18); background:transparent; color:#f5f2ea; font-family:'Inter',sans-serif; font-size:13px; font-weight:600; cursor:pointer; transition:.2s; }
  .btn-outline:hover { border-color:rgba(255,255,255,.4); }
  .btn-signout { color:rgba(255,255,255,.45); }
  .btn-signout:hover { color:#e57373; border-color:rgba(229,115,115,.4); }

  .section-title { font-size:12px; letter-spacing:.25em; text-transform:uppercase; color:#8a8375; margin-bottom:18px; }

  /* Empty state */
  #acct-empty { display:none; text-align:center; padding:60px 20px; border:1px dashed rgba(255,255,255,.14); border-radius:14px; }
  #acct-empty p { color:rgba(255,255,255,.5); font-size:14.5px; margin-bottom:22px; }

  /* CV list */
  #acct-cv-list { display:flex; flex-direction:column; gap:12px; }
  .cv-card { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 20px; background:#131315; border:1px solid rgba(255,255,255,.08); border-radius:12px; transition:border-color .2s; }
  .cv-card:hover { border-color:rgba(255,255,255,.18); }
  .cv-card-info { min-width:0; }
  .cv-card-title { font-size:15px; font-weight:600; color:#f5f2ea; margin-bottom:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cv-card-meta { display:flex; align-items:center; gap:8px; font-size:12px; color:rgba(255,255,255,.4); flex-wrap:wrap; }
  .tier-badge { padding:2px 9px; border-radius:20px; font-size:10.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; }
  .tier-badge.pro { background:rgba(216,208,184,.15); color:#d8d0b8; }
  .tier-badge.royal { background:rgba(212,175,55,.15); color:#d4af37; }
  .tier-badge.elite { background:linear-gradient(135deg,rgba(236,230,214,.2),rgba(216,208,184,.2)); color:#ece6d6; }
  .job-badge { padding:2px 9px; border-radius:20px; font-size:10.5px; background:rgba(255,255,255,.08); color:rgba(255,255,255,.55); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:180px; }

  .cv-card-actions { display:flex; gap:8px; flex-shrink:0; }
  .icon-btn { width:34px; height:34px; border-radius:8px; border:1px solid rgba(255,255,255,.12); background:transparent; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.2s; color:rgba(255,255,255,.6); }
  .icon-btn:hover { border-color:rgba(255,255,255,.3); color:#f5f2ea; }
  .icon-btn.danger:hover { border-color:rgba(229,115,115,.5); color:#e57373; }
  .icon-btn svg { width:15px; height:15px; }

  .new-cv-btn { display:inline-flex; align-items:center; gap:8px; padding:13px 22px; border-radius:10px; background:linear-gradient(135deg,#ece6d6,#d8d0b8); color:#0a0a0c; font-family:'Inter',sans-serif; font-size:14px; font-weight:700; text-decoration:none; }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo"><img src="logo.png" alt="Kavox"></a>
  <button class="exit-link" onclick="signOut()">Sign out</button>
</nav>

<div class="wrap">
  <div id="acct-loading">Loading your account…</div>

  <div id="acct-content" style="display:none;">
    <div class="acct-header">
      <div class="acct-avatar-wrap" onclick="document.getElementById('avatar-input').click()">
        <div class="avatar-img" id="acct-avatar"></div>
        <div class="avatar-edit"><svg viewBox="0 0 24 24" fill="none" stroke="#0a0a0c" stroke-width="2.5"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></div>
        <input type="file" id="avatar-input" accept="image/*" onchange="handleAvatarChange(event)">
      </div>
      <div>
        <div class="acct-name-row">
          <h1 class="acct-name" id="acct-name-display">—</h1>
          <button class="acct-name-edit-btn" onclick="startNameEdit()" title="Edit name">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </button>
          <input type="text" class="acct-name-input" id="acct-name-input" onkeydown="if(event.key==='Enter')saveName(); if(event.key==='Escape')cancelNameEdit();">
        </div>
        <div class="acct-email" id="acct-email">—</div>
      </div>
    </div>

    <div class="acct-actions-row">
      <a href="build.html" class="new-cv-btn">+ New CV</a>
    </div>

    <div class="section-title">Your Saved CVs</div>

    <div id="acct-empty">
      <p>You haven't saved a CV yet.</p>
      <a href="build.html" class="new-cv-btn">+ Create your first CV</a>
    </div>

    <div id="acct-cv-list"></div>
  </div>
</div>

<div id="onboarding-overlay">
  <div class="onboard-card">
    <div class="onboard-eyebrow">Welcome</div>
    <h2 class="onboard-title">Set up your profile</h2>
    <p class="onboard-sub">Add your name and a photo — takes a few seconds.</p>

    <div class="avatar-picker" onclick="document.getElementById('onboard-avatar-input').click()">
      <div class="avatar-img" id="onboard-avatar-preview">+</div>
      <div class="avatar-edit"><svg viewBox="0 0 24 24" fill="none" stroke="#0a0a0c" stroke-width="2.5"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></div>
      <input type="file" id="onboard-avatar-input" accept="image/*" onchange="handleOnboardAvatarChange(event)">
    </div>

    <div class="field">
      <label>Your Name</label>
      <input type="text" id="onboard-name" placeholder="e.g. Sarah Ahmed">
    </div>

    <div class="onboard-err" id="onboard-err"></div>
    <button class="btn-primary" id="onboard-save-btn" onclick="completeOnboarding()">Save & Continue</button>
    <button class="btn-skip" onclick="skipOnboarding()">Skip for now</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
requestAnimationFrame(function(){ requestAnimationFrame(function(){ document.body.classList.add('kv-page-ready'); }); });

let _sb = null;
let _user = null;
let _pendingOnboardFile = null;
let _pendingAvatarFile = null;

async function initSupabase() {
  if (_sb) return _sb;
  const res = await fetch('/api/config', {});
  if (!res.ok) throw new Error('Config fetch failed');
  const cfg = await res.json();
  if (!cfg.supabaseUrl || !cfg.supabaseKey) throw new Error('Supabase env vars missing');
  const { createClient } = window.supabase;
  _sb = createClient(cfg.supabaseUrl, cfg.supabaseKey);
  return _sb;
}

function initials(nameOrEmail) {
  if (!nameOrEmail) return '?';
  return nameOrEmail.trim().charAt(0).toUpperCase();
}

function renderAvatar(el, url, fallbackText) {
  if (url) {
    el.innerHTML = '';
    el.style.backgroundImage = `url('${url}')`;
    el.style.backgroundSize = 'cover';
    el.style.backgroundPosition = 'center';
    el.textContent = '';
  } else {
    el.style.backgroundImage = 'none';
    el.textContent = fallbackText;
  }
}

async function boot() {
  try {
    await initSupabase();
    const { data: { session } } = await _sb.auth.getSession();
    if (!session || !session.user) {
      window.location.href = 'login.html';
      return;
    }
    _user = session.user;
    const meta = _user.user_metadata || {};

    document.getElementById('acct-loading').style.display = 'none';
    document.getElementById('acct-content').style.display = 'block';

    document.getElementById('acct-email').textContent = _user.email || '';
    document.getElementById('acct-name-display').textContent = meta.display_name || (_user.email ? _user.email.split('@')[0] : 'Account');
    renderAvatar(document.getElementById('acct-avatar'), meta.avatar_url, initials(meta.display_name || _user.email));

    // First-time onboarding: no display_name set yet and never explicitly skipped
    if (!meta.display_name && !meta.onboarding_skipped) {
      document.getElementById('onboarding-overlay').style.display = 'flex';
    }

    loadSavedCVs();
  } catch (e) {
    console.error('Account init failed:', e);
    document.getElementById('acct-loading').textContent = 'Something went wrong loading your account. Please refresh.';
  }
}

async function loadSavedCVs() {
  const { data, error } = await _sb
    .from('cvs')
    .select('id, created_at, name, tier, job_title, company_name')
    .eq('user_id', _user.id)
    .order('created_at', { ascending: false });

  const listEl = document.getElementById('acct-cv-list');
  const emptyEl = document.getElementById('acct-empty');

  if (error) {
    console.error('Failed to load CVs:', error);
    listEl.innerHTML = '';
    emptyEl.style.display = 'block';
    emptyEl.querySelector('p').textContent = 'Could not load your CVs. Please refresh.';
    return;
  }

  if (!data || data.length === 0) {
    listEl.innerHTML = '';
    emptyEl.style.display = 'block';
    return;
  }

  emptyEl.style.display = 'none';
  listEl.innerHTML = data.map(cv => {
    const tier = (cv.tier || 'pro').toLowerCase();
    const date = new Date(cv.created_at).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
    const jobBadge = cv.job_title ? `<span class="job-badge">${escapeHtml(cv.job_title)}${cv.company_name ? ' · ' + escapeHtml(cv.company_name) : ''}</span>` : '';
    return `
      <div class="cv-card">
        <div class="cv-card-info">
          <div class="cv-card-title">${escapeHtml(cv.name || 'Untitled CV')}</div>
          <div class="cv-card-meta">
            <span class="tier-badge ${tier}">${tier}</span>
            <span>${date}</span>
            ${jobBadge}
          </div>
        </div>
        <div class="cv-card-actions">
          <button class="icon-btn" title="View" onclick="viewSavedCV(${cv.id})">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <button class="icon-btn danger" title="Delete" onclick="deleteSavedCV(${cv.id})">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          </button>
        </div>
      </div>`;
  }).join('');
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function viewSavedCV(id) {
  window.location.href = 'build.html?view=' + id;
}

async function deleteSavedCV(id) {
  if (!confirm('Delete this CV? This cannot be undone.')) return;
  const { error } = await _sb.from('cvs').delete().eq('id', id).eq('user_id', _user.id);
  if (error) { alert('Could not delete CV: ' + error.message); return; }
  loadSavedCVs();
}

async function signOut() {
  await _sb.auth.signOut();
  window.location.href = 'index.html';
}

// ── Name editing ──
function startNameEdit() {
  const display = document.getElementById('acct-name-display');
  const input = document.getElementById('acct-name-input');
  input.value = display.textContent;
  display.style.display = 'none';
  input.style.display = 'inline-block';
  input.focus();
  input.select();
}
function cancelNameEdit() {
  document.getElementById('acct-name-input').style.display = 'none';
  document.getElementById('acct-name-display').style.display = '';
}
async function saveName() {
  const val = document.getElementById('acct-name-input').value.trim();
  if (!val) { cancelNameEdit(); return; }
  const { error } = await _sb.auth.updateUser({ data: { display_name: val } });
  if (error) { alert('Could not save name: ' + error.message); return; }
  document.getElementById('acct-name-display').textContent = val;
  cancelNameEdit();
}

// ── Avatar upload (shared by account page + onboarding) ──
async function uploadAvatar(file) {
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = `${_user.id}/avatar.${ext}`;
  const { error: upErr } = await _sb.storage.from('avatars').upload(path, file, { upsert: true, cacheControl: '3600' });
  if (upErr) throw upErr;
  const { data: pub } = _sb.storage.from('avatars').getPublicUrl(path);
  const url = pub.publicUrl + '?t=' + Date.now(); // cache-bust
  const { error: metaErr } = await _sb.auth.updateUser({ data: { avatar_url: url } });
  if (metaErr) throw metaErr;
  return url;
}

function handleAvatarChange(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  uploadAvatar(file)
    .then(url => renderAvatar(document.getElementById('acct-avatar'), url, ''))
    .catch(e => alert('Could not upload photo: ' + e.message));
}

// ── Onboarding ──
function handleOnboardAvatarChange(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  _pendingOnboardFile = file;
  const reader = new FileReader();
  reader.onload = e => {
    const el = document.getElementById('onboard-avatar-preview');
    el.style.backgroundImage = `url('${e.target.result}')`;
    el.style.backgroundSize = 'cover';
    el.style.backgroundPosition = 'center';
    el.textContent = '';
  };
  reader.readAsDataURL(file);
}

async function completeOnboarding() {
  const name = document.getElementById('onboard-name').value.trim();
  const errEl = document.getElementById('onboard-err');
  const btn = document.getElementById('onboard-save-btn');
  errEl.style.display = 'none';

  if (!name) {
    errEl.textContent = 'Please enter your name.';
    errEl.style.display = 'block';
    return;
  }

  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const updates = { display_name: name };
    if (_pendingOnboardFile) {
      const url = await uploadAvatar(_pendingOnboardFile);
      updates.avatar_url = url;
    } else {
      await _sb.auth.updateUser({ data: updates });
    }
    document.getElementById('onboarding-overlay').style.display = 'none';
    document.getElementById('acct-name-display').textContent = name;
    const meta = (await _sb.auth.getUser()).data.user.user_metadata || {};
    renderAvatar(document.getElementById('acct-avatar'), meta.avatar_url, initials(name));
  } catch (e) {
    errEl.textContent = 'Could not save: ' + e.message;
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Save & Continue';
  }
}

async function skipOnboarding() {
  await _sb.auth.updateUser({ data: { onboarding_skipped: true } });
  document.getElementById('onboarding-overlay').style.display = 'none';
}

document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
